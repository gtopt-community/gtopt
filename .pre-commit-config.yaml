repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep >= the ruff floor of scripts[dev] (scripts/pyproject.toml).
    rev: v0.17.6
    hooks:
      - id: ruff          # lint + auto-fix (replaces flake8)
        args: [--fix]
        files: ^(scripts|guiservice)/
      - id: ruff-format   # format (replaces black)
        files: ^(scripts|guiservice)/

  - repo: https://github.com/PyCQA/pylint
    # Keep >= the pylint floor of scripts[dev].
    rev: v4.1.4
    hooks:
      - id: pylint
        args: [--output-format=text, --score=no]
        files: ^(scripts|guiservice)/

  # shellcheck as a PyPI wheel (the koalaman hook needs Docker); same
  # version as shellcheck-py in scripts[lint].
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # actionlint as a self-contained PyPI wheel (no Go toolchain needed);
  # same version as actionlint-py in scripts[lint].
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        # Workflow-structure errors only: the embedded shellcheck pass
        # reports ~120 pre-existing info/style findings in run: blocks.
        args: [-shellcheck=]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.9.0
    hooks:
      - id: yamllint
        args: [-d=relaxed]

  - repo: https://github.com/igorshubovych/markdownlint-cli.git
    rev: v0.9.0
    hooks:
      - id: markdownlint
        args: [--config=.markdownlint.json]
        # Dated investigation notes / plans, agent files, verbatim
        # third-party licences and PAMPL documentation templates.
        exclude: ^(docs/analysis|docs/scripts/plans|docs/tasks|\.claude)/|LICENSE|^scripts/gtopt_expand/templates/

  # Clang-format pinned to the same major version used by CI (Clang 21).
  # pre-commit/mirrors-clang-format ships clang-format as a self-contained
  # Python wheel, so every developer and CI job gets the exact same binary
  # regardless of what is installed on the host system.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.6
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: local
    hooks:
      - id: check-latex-math
        name: LaTeX math in Markdown (same as the Docs workflow)
        entry: python3 tools/check_latex_math.py
        language: system
        files: \.md$
