# pyproject.toml for the gtopt guiservice Python package.

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtopt-guiservice"
version = "1.2.0"
description = "GTOpt GUI service (Flask web app for case management)"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=23.0.1",
    "requests>=2.33.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pylint>=4.0.9",
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4.0",
    # Same exact pin as scripts/pyproject.toml and guiservice.yml.
    "ty==0.0.107",
    "types-requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["guiservice*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["guiservice/tests"]
addopts = "-v --import-mode=importlib -n auto"
pythonpath = ["."]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["guiservice"]
omit = ["*/test*", "*/tests/*", "*/__pycache__/*", "*/venv/*"]

[tool.coverage.report]
show_missing = true
precision = 1
# No `pragma: no cover` entry on purpose (see scripts/pyproject.toml).
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
fail_under = 95

# Gate enforced by tools/check_coverage_per_package.py (guiservice.yml):
# same policy as scripts/ -- package >= 90 %, total >= 95 %, BRANCH
# coverage, gaps closed with tests.
[tool.gtopt.coverage]
package_min = 90.0
total_min = 95.0

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# pylint (inherits root .pylintrc; these settings are additive)
# ---------------------------------------------------------------------------

[tool.pylint.format]
max-line-length = 150

[tool.pylint.design]
max-args = 12
max-locals = 25
max-branches = 16
max-statements = 60

[tool.pylint."messages control"]
disable = [
    "missing-docstring",
    "too-few-public-methods",
    "import-error",
    "redefined-outer-name",
    "global-statement",
    "duplicate-code",
    "protected-access",
    "too-many-positional-arguments",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false
exclude = ["tests/"]

# ---------------------------------------------------------------------------
# ty (astral-sh/ty) -- fast, NON-blocking advisory checker run in CI after
# mypy.  Run from this directory: `ty check app.py gtopt_gui.py ...`.
# ---------------------------------------------------------------------------

[tool.ty.environment]
python-version = "3.10"
# app.py imports ``guiservice._schemas`` (package form), so the repo root
# is the import root; ../scripts replaces the runtime sys.path.insert()
# hack that ty does not follow.
root = [".."]
extra-paths = ["../scripts"]

[tool.ty.analysis]
# pandas ships no py.typed: mypy treats it as Any, ty would analyse its
# incomplete inline annotations.  Keep parity with mypy.
replace-imports-with-any = ["pyarrow.compute", "pandas", "pandas.**"]
