    <text x="996" y="225" class="t">Water values</text>
    <text x="996" y="246" class="s">storage opportunity costs</text>

    <rect x="978" y="268" width="262" height="60" rx="14" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.55"/>
    <text x="996" y="293" class="t">Expansion plan</text>
    <text x="996" y="314" class="s">generation · lines · storage · demand</text>

    <rect x="978" y="336" width="262" height="60" rx="14" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.55"/>
    <text x="996" y="361" class="t">Emissions</text>
    <text x="996" y="382" class="s">marginal CO₂ per bus and hour</text>
  </g>
  <text x="1109" y="420" text-anchor="middle" font-size="11.5" fill="#9fb3d9">Parquet · CSV</text>
  <path d="M1109 428 L 1109 446" stroke="#fcd34d" stroke-width="2" marker-end="url(#ah-amber)"/>

  <!-- ===== INTERFACES ===== -->
  <text x="978" y="470" class="h" fill="#a78bfa">INTERFACES</text>
  <g>
    <rect x="978" y="482" width="126" height="54" rx="13" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="992" y="505" class="t" font-size="14">run_gtopt</text>
