    <rect x="1114" y="482" width="126" height="54" rx="13" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="1128" y="505" class="t" font-size="14">Browser GUI</text>
    <text x="1128" y="524" class="s" font-size="11.5">editor · results</text>
    <rect x="978" y="546" width="126" height="54" rx="13" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="992" y="569" class="t" font-size="14">REST API</text>
    <text x="992" y="588" class="s" font-size="11.5">web service</text>
    <rect x="1114" y="546" width="126" height="54" rx="13" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="1128" y="569" class="t" font-size="14">Data tools</text>
    <text x="1128" y="588" class="s" font-size="11.5">pandas · DuckDB</text>
  </g>

  <!-- footer -->
  <text x="640" y="638" text-anchor="middle" font-size="13" fill="#7f93ba">open source · AGPL-3.0 or commercial licence · github.com/gtopt-community/gtopt</text>
</svg>
