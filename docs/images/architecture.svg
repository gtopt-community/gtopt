<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-labelledby="t d">
  <title id="t">GTOpt architecture</title>
  <desc id="d">Inputs (JSON and Parquet cases, converters from PLP, PLEXOS, PSR SDDP, PSS/E and pandapower, PAMPL constraints, Excel) feed the GTOpt C++ core, which models electricity, water, fuels and LNG, hydrogen, ammonia and heat, assembles the LP/MIP and solves it with the monolithic, SDDP or cascade method across time scales from 15 minutes to 30 years, coupled by SDDP optimality and feasibility cuts, through open-source or commercial solver plugins. Results (dispatch and prices, water values, expansion plan, emissions) are read by the terminal dashboard, browser GUI, REST API and data tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#121f45"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="inflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="outflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c7d2fe"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#93c5fd"/>
    </marker>
    <marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fcd34d"/>
    </marker>
    <marker id="ah-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c4b5fd"/>
    </marker>
  </defs>

  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .h  { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .t  { font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .s  { font-size: 12.5px; fill: #b6c4e0; }
    .c  { font-size: 11.5px; font-weight: 600; fill: #e2e8f0; }
    .p  { font-size: 12px; font-weight: 600; }
  </style>

  <!-- background -->
  <rect width="1280" height="660" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="660" rx="28" fill="url(#dots)"/>

  <!-- title -->
  <text x="40" y="62" font-size="30" font-weight="800" fill="#f8fafc">GTOpt</text>
  <text x="152" y="62" font-size="17" fill="#9fb3d9">energy-system optimization · one model from minutes to decades</text>

  <!-- ===== INPUTS ===== -->
  <text x="40" y="118" class="h" fill="#2dd4bf">INPUTS</text>
  <g>
    <rect x="40" y="132" width="250" height="78" rx="14" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="58" y="164" class="t">JSON cases</text>
    <text x="58" y="186" class="s">Parquet · CSV time series</text>

    <rect x="40" y="224" width="250" height="96" rx="14" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="58" y="256" class="t">Converters</text>
    <text x="58" y="278" class="s">PLP · PLEXOS · PSR SDDP</text>
    <text x="58" y="298" class="s">PSS/E · pandapower · Sienna</text>

    <rect x="40" y="334" width="250" height="78" rx="14" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="58" y="366" class="t">PAMPL</text>
    <text x="58" y="388" class="s">constraints without code</text>

    <rect x="40" y="426" width="250" height="78" rx="14" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="58" y="458" class="t">Excel workbooks</text>
    <text x="58" y="480" class="s">igtopt</text>
  </g>

  <!-- inputs -> core -->
  <g stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-teal)">
    <path d="M292 171 H 326"/>
    <path d="M292 272 H 326"/>
    <path d="M292 373 H 326"/>
    <path d="M292 465 H 326"/>
  </g>

  <!-- ===== CORE ===== -->
  <rect x="330" y="104" width="604" height="500" rx="22" fill="#3b82f6" opacity="0.18" filter="url(#glow)"/>
  <rect x="330" y="104" width="604" height="500" rx="22" fill="url(#core)" stroke="#60a5fa" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="352" y="138" class="h" fill="#93c5fd">GTOPT CORE · C++26</text>

  <!-- carriers -->
  <text x="352" y="166" class="h" fill="#7f93ba" font-size="10.5">ENERGY SYSTEM</text>
  <g>
    <!-- electricity -->
    <rect x="352" y="176" width="88" height="62" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#facc15" stroke-opacity="0.45"/>
    <circle cx="396" cy="198" r="13" fill="#facc15" fill-opacity="0.18"/>
    <path d="M398 188 L389 200 L395 200 L393 209 L403 196 L397 196 Z" fill="#facc15"/>
    <text x="396" y="229" class="c" text-anchor="middle">Electricity</text>
    <!-- water -->
    <rect x="448" y="176" width="88" height="62" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle cx="492" cy="198" r="13" fill="#38bdf8" fill-opacity="0.18"/>
    <path d="M492 188 C 486 196, 485 200, 485 203 A 7 7 0 0 0 499 203 C 499 200, 498 196, 492 188 Z" fill="#38bdf8"/>
    <text x="492" y="229" class="c" text-anchor="middle">Water</text>
    <!-- fuels / LNG -->
    <rect x="544" y="176" width="88" height="62" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#fb923c" stroke-opacity="0.45"/>
    <circle cx="588" cy="198" r="13" fill="#fb923c" fill-opacity="0.18"/>
    <path d="M588 187 C 592 193, 596 196, 595 202 A 7 7 0 0 1 581 202 C 581 198, 584 196, 585 193 C 587 196, 588 197, 589 196 C 590 193, 589 190, 588 187 Z" fill="#fb923c"/>
    <text x="588" y="229" class="c" text-anchor="middle">Fuels · LNG</text>
    <!-- hydrogen -->
    <rect x="640" y="176" width="88" height="62" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#a3e635" stroke-opacity="0.45"/>
    <circle cx="684" cy="198" r="13" fill="#a3e635" fill-opacity="0.18"/>
    <text x="684" y="203" text-anchor="middle" font-size="12" font-weight="800" fill="#a3e635">H₂</text>
    <text x="684" y="229" class="c" text-anchor="middle">Hydrogen</text>
    <!-- ammonia -->
    <rect x="736" y="176" width="88" height="62" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f472b6" stroke-opacity="0.45"/>
    <circle cx="780" cy="198" r="13" fill="#f472b6" fill-opacity="0.18"/>
    <text x="780" y="202" text-anchor="middle" font-size="10.5" font-weight="800" fill="#f472b6">NH₃</text>
    <text x="780" y="229" class="c" text-anchor="middle">Ammonia</text>
    <!-- heat -->
    <rect x="832" y="176" width="80" height="62" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f87171" stroke-opacity="0.45"/>
    <circle cx="872" cy="198" r="13" fill="#f87171" fill-opacity="0.18"/>
    <g fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round">
      <path d="M866 206 c -3 -4, 3 -6, 0 -11 c -2 -3, 1 -5, 0 -7"/>
      <path d="M872 206 c -3 -4, 3 -6, 0 -11 c -2 -3, 1 -5, 0 -7"/>
      <path d="M878 206 c -3 -4, 3 -6, 0 -11 c -2 -3, 1 -5, 0 -7"/>
    </g>
    <text x="872" y="229" class="c" text-anchor="middle">Heat</text>
  </g>

  <!-- pipeline -->
  <g>
    <rect x="352" y="258" width="172" height="66" rx="14" fill="#0b1330" fill-opacity="0.55" stroke="#93c5fd" stroke-opacity="0.5"/>
    <text x="368" y="286" class="t">System model</text>
    <text x="368" y="307" class="s">network · units · storage</text>

    <rect x="546" y="258" width="172" height="66" rx="14" fill="#0b1330" fill-opacity="0.55" stroke="#93c5fd" stroke-opacity="0.5"/>
    <text x="562" y="286" class="t">LP / MIP assembly</text>
    <text x="562" y="307" class="s">sparse · scaled · auditable</text>

    <rect x="740" y="258" width="172" height="66" rx="14" fill="#0b1330" fill-opacity="0.55" stroke="#93c5fd" stroke-opacity="0.5"/>
    <text x="756" y="286" class="t">Methods</text>
    <text x="756" y="307" class="s">LP · SDDP · cascade</text>

    <g stroke="#93c5fd" stroke-width="2" fill="none" marker-end="url(#ahb)">
      <path d="M526 291 L 543 291"/>
      <path d="M720 291 L 737 291"/>
    </g>
  </g>

