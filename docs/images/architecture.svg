  <g fill="#e2e8f0" font-size="11" text-anchor="middle">
    <circle cx="358" cy="394" r="4" fill="#0a1330" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="470" cy="394" r="4" fill="#0a1330" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="610" cy="394" r="4" fill="#0a1330" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="740" cy="394" r="4" fill="#0a1330" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="906" cy="394" r="4" fill="#0a1330" stroke="#ffffff" stroke-width="1.5"/>
    <text x="364" y="420">15 min</text>
    <text x="470" y="420">day</text>
    <text x="610" y="420">month</text>
    <text x="740" y="420">year</text>
    <text x="890" y="420">30 years</text>
  </g>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <text x="424" y="446" fill="#5eead4">Operation</text>
    <text x="640" y="446" fill="#93c5fd">Medium term</text>
    <text x="846" y="446" fill="#c4b5fd">Planning</text>
  </g>
  <text x="632" y="470" text-anchor="middle" font-size="12.5" font-style="italic" fill="#b6c4e0">coupled by SDDP optimality and feasibility cuts</text>

  <!-- solvers -->
  <text x="352" y="506" class="h" fill="#7f93ba" font-size="10.5">SOLVER PLUGINS</text>
  <g text-anchor="middle">
    <rect x="352" y="518" width="74" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="389" y="538" class="p" fill="#a7f3d0">HiGHS</text>
    <rect x="432" y="518" width="80" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="472" y="538" class="p" fill="#a7f3d0">CBC / CLP</text>
    <rect x="518" y="518" width="64" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="550" y="538" class="p" fill="#a7f3d0">SCIP</text>
    <rect x="588" y="518" width="96" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="636" y="538" class="p" fill="#a7f3d0">cuOpt · GPU</text>
    <rect x="690" y="518" width="70" height="30" rx="15" fill="#94a3b8" fill-opacity="0.1" stroke="#94a3b8" stroke-opacity="0.6"/>
    <text x="725" y="538" class="p" fill="#e2e8f0">CPLEX</text>
    <rect x="766" y="518" width="70" height="30" rx="15" fill="#94a3b8" fill-opacity="0.1" stroke="#94a3b8" stroke-opacity="0.6"/>
    <text x="801" y="538" class="p" fill="#e2e8f0">Gurobi</text>
    <rect x="842" y="518" width="70" height="30" rx="15" fill="#94a3b8" fill-opacity="0.1" stroke="#94a3b8" stroke-opacity="0.6"/>
    <text x="877" y="538" class="p" fill="#e2e8f0">MindOpt</text>
  </g>
  <g font-size="11" fill="#9fb3d9">
    <circle cx="358" cy="574" r="4.5" fill="#34d399"/>
    <text x="368" y="578">open source</text>
    <circle cx="458" cy="574" r="4.5" fill="#94a3b8"/>
    <text x="468" y="578">commercial · loaded at run time</text>
  </g>

  <!-- core -> results -->
  <g stroke="#fcd34d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-amber)">
    <path d="M936 162 H 974"/>
    <path d="M936 230 H 974"/>
    <path d="M936 298 H 974"/>
    <path d="M936 366 H 974"/>
  </g>

  <!-- ===== RESULTS ===== -->
  <text x="978" y="118" class="h" fill="#fbbf24">RESULTS</text>
  <g>
    <rect x="978" y="132" width="262" height="60" rx="14" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.55"/>
    <text x="996" y="157" class="t">Dispatch &amp; prices</text>
    <text x="996" y="178" class="s">nodal prices · duals · flows</text>

