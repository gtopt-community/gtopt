name: Register as a GTOpt user
description: List your organization, group or yourself as a GTOpt user
title: "New GTOpt user"
labels: ["users"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using GTOpt! Just fill in the fields below; you do not
        need to change the title or edit any file.  We will add you to the
        [list of users](https://github.com/gtopt-community/gtopt/blob/master/USERS.md).
        Everything you write here is public; do not include confidential
        information.
  - type: dropdown
    id: kind
    attributes:
      label: Category
      options:
        - Company, system operator or public agency
        - University or research centre
        - Individual researcher or student
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: Organization, group or person, as it should appear.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Website (optional)
  - type: input
    id: country
    attributes:
      label: Country
    validations:
      required: true
  - type: input
    id: affiliation
    attributes:
      label: Affiliation or power system (optional)
      description: e.g. a university, company or the system you study ("Chilean SEN", "WECC").
  - type: textarea
    id: use
    attributes:
      label: What do you use GTOpt for?
      description: One or two sentences, e.g. "expansion planning studies of the Peruvian system" or "teaching hydrothermal scheduling".
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I am authorized to list this organization or group publicly.
          required: true
