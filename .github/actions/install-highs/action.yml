name: Install HiGHS (pinned)
description: >
  Builds a pinned HiGHS release from source into a cached prefix so that
  every CI run tests the HiGHS solver plugin against the SAME HiGHS version.
  Ubuntu 24.04 (the runner) does not package HiGHS, and a system or newer
  HiGHS can return a different (equally optimal) vertex, which breaks
  golden comparisons that look at primal values.  The pin matches the tag
  install.sh builds (it only takes the distro libhighs-dev when that is at
  least this version), i.e. what users get.  When bumping it, bump
  `install_highs ... tag=` in install.sh too and re-check the HiGHS
  goldens.  Built with HiPO (-DHIPO=ON, parallel interior point, the
  `barrier` algorithm) and the OpenBLAS it needs (-DBUILD_OPENBLAS=ON).
  A cache hit costs seconds; a cold build ~5-8 min.

inputs:
  version:
    description: HiGHS release (git tag without the leading 'v')
    default: '1.16.0'
  compiler:
    description: C++ compiler used to build HiGHS (match the gtopt build)
    default: 'g++-14'
  c-compiler:
    description: C compiler used to build HiGHS
    default: 'gcc-14'

outputs:
  prefix:
    description: Install prefix (pass as -DHIGHS_ROOT_DIR=...)
    value: ${{ steps.vars.outputs.prefix }}
  version:
    description: The pinned HiGHS version
    value: ${{ inputs.version }}

runs:
  using: composite
  steps:
    - name: resolve prefix
      id: vars
      shell: bash
      run: echo "prefix=$HOME/opt/highs-${{ inputs.version }}" >> "$GITHUB_OUTPUT"

    - name: restore HiGHS cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.vars.outputs.prefix }}
        key: highs-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.compiler }}-hipo-v2

    - name: build HiGHS ${{ inputs.version }} from source
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        HIGHS_TAG: v${{ inputs.version }}
        PREFIX: ${{ steps.vars.outputs.prefix }}
        CC: ${{ inputs.c-compiler }}
        CXX: ${{ inputs.compiler }}
      run: |
        set -euo pipefail
        src=$(mktemp -d)
        git clone -q --depth 1 --branch "$HIGHS_TAG" \
          https://github.com/ERGO-Code/HiGHS.git "$src/HiGHS"
        cmake -S "$src/HiGHS" -B "$src/build" -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON -DFAST_BUILD=ON -DBUILD_TESTING=OFF \
          -DHIPO=ON -DBUILD_OPENBLAS=ON \
          -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_PREFIX="$PREFIX"
        cmake --build "$src/build" -j"$(nproc)"
        cmake --install "$src/build"
        rm -rf "$src"

    - name: check installed version
      shell: bash
      env:
        PREFIX: ${{ steps.vars.outputs.prefix }}
        WANT: ${{ inputs.version }}
      run: |
        set -euo pipefail
        hdr="$PREFIX/include/highs/HConfig.h"
        got=$(awk '/#define HIGHS_VERSION_(MAJOR|MINOR|PATCH) /{v=v (v?".":"") $3} END{print v}' "$hdr")
        echo "HiGHS at $PREFIX: $got"
        if [ "$got" != "$WANT" ]; then
          echo "::error::HiGHS cache holds $got, expected $WANT"
          exit 1
        fi
