name: TSan

# ThreadSanitizer build + C++ test run.
#
# Builds the whole `all/` super-project with clang 22 and
# -DUSE_SANITIZER=Thread (cmake/tools.cmake -> cmake-scripts
# sanitizers.cmake, adds -fsanitize=thread to compile AND link flags),
# then runs the C++ ctest suite with tools/tsan.supp.  Any unsuppressed
# TSan report makes the reporting test process exit with code 66, so the
# ctest step (and the job) fails.
#
# Trigger: manual only (workflow_dispatch), NOT push / schedule / PR.
# Measured on a 40-core box restricted to -j4 (comparable to a 4-vCPU
# runner): the cold TSan build takes ~42 min and the full C++ ctest
# (~5400 tests) ~21 min with HiGHS, i.e. ~1 h cold / ~25-35 min with a
# warm ccache -- 2-3x the regular Ubuntu job.  The regular race backstop
# is the weekly TSan stage of the maintainers' local nightly run;
# dispatch this workflow to check a
# branch on a GitHub runner (optionally narrowed with `ctest_regex`).
#
# Notes:
#   * jemalloc is disabled (-DGTOPT_USE_JEMALLOC=OFF): TSan intercepts
#     malloc/free itself and a replacement allocator breaks that.
#   * The pinned HiGHS is the only solver plugin built on the runner; the
#     run pins GTOPT_SOLVER=highs.  Solver libraries are not instrumented;
#     their races are handled in tools/tsan.supp (third-party only --
#     gtopt races are fixed, never suppressed).
#   * Python tests are off (GTOPT_REGISTER_PYTHON_TESTS defaults OFF).

on:
  workflow_dispatch:
    inputs:
      ctest_regex:
        description: 'Optional ctest -R regex (empty = full suite)'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  CCACHE_BASEDIR: ${{ github.workspace }}
  # Same LLVM major as the clang-tidy workflow (TIDY_VERSION 22).
  CC: clang-22
  CXX: clang++-22
  # HiGHS (pinned) is the only solver plugin built here; see ubuntu.yml.
  GTOPT_SOLVER: highs

permissions:
  contents: read

jobs:
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    name: tsan

    steps:
      - uses: actions/checkout@v7

      - name: setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: gtopt-tsan-clang22
          restore-keys: |
            gtopt-tsan-clang22-
          max-size: 2G

      - uses: actions/cache@v6
        with:
          path: "**/cpm_modules"
          key: tsan-cpm-modules-${{ hashFiles('cmake/CPM.cmake', 'cmake/tools.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            tsan-cpm-modules-

      - name: install dependencies
        uses: ./.github/actions/install-apt-deps
        with:
          # HiGHS only: no COIN-OR, so the OSI plugin is not built.
          coinor: 'false'

      # Full LLVM suite: includes libclang-rt-22-dev (the TSan runtime)
      # and llvm-symbolizer (llvm-22-tools; symbolised TSan stacks).
      - name: install clang
        uses: ./.github/actions/install-clang
        with:
          version: 22

      # Pinned HiGHS (see .github/actions/install-highs), the ONLY LP/MIP
      # solver here: install-apt-deps runs with coinor 'false', so the OSI
      # (CLP/CBC) plugin is not built.  Same version + cache as ubuntu.yml.
      - name: install HiGHS (pinned)
        id: highs
        uses: ./.github/actions/install-highs

      # Ubuntu 24.04 runner kernels use 32 bits of mmap ASLR entropy, which
      # can collide with TSan's fixed shadow-memory layout ("unexpected
      # memory mapping").  28 bits is the value TSan supports everywhere.
      - name: lower ASLR entropy for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: configure
        run: |
          set -o pipefail
          cmake -S all -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O1 -g" \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g" \
            -DUSE_SANITIZER=Thread \
            -DGTOPT_USE_JEMALLOC=OFF \
            -DGTOPT_BUILD_INTEGRATION_TESTS=ON \
            -DGTOPT_BUILD_SCRIPTS=OFF \
            -DGTOPT_BUILD_WEBSERVICE=OFF \
            -DGTOPT_BUILD_GUISERVICE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DHIGHS_ROOT_DIR="${HIGHS_PREFIX}" 2>&1 | tee configure.log
          if ! grep -qF "HiGHS enabled (${HIGHS_VERSION})" configure.log; then
            echo "::error::HiGHS plugin not built against pinned HiGHS ${HIGHS_VERSION}"
            exit 1
          fi
        env:
          HIGHS_PREFIX: ${{ steps.highs.outputs.prefix }}
          HIGHS_VERSION: ${{ steps.highs.outputs.version }}

      - name: build
        run: cmake --build build -j"$(nproc)"

      - name: test
        run: |
          set -o pipefail
          ulimit -c unlimited
          mkdir -p "${GITHUB_WORKSPACE}/tsan-logs"
          cd build
          # HiGHS only (pinned, uninstrumented: its internal races are
          # suppressed in tools/tsan.supp); covers both LP and MIP paths.
          export GTOPT_SOLVER=highs
          SYMBOLIZER=$(command -v llvm-symbolizer-22 || command -v llvm-symbolizer)
          export TSAN_OPTIONS="halt_on_error=0 second_deadlock_stack=1 history_size=4 suppressions=${GITHUB_WORKSPACE}/tools/tsan.supp log_path=${GITHUB_WORKSPACE}/tsan-logs/tsan external_symbolizer_path=${SYMBOLIZER}"
          # Excluded: the e2e_*_sddp_validate checks -- pure-Python
          # (tools/validate_sddp_output.py needs pandas + pyarrow, which
          # this runner does not install; Python tests are off here).
          # The e2e_*_sddp_solve runs they check still run under TSan.
          # (The SDDP literature A1 tests are no longer excluded: their
          # 8194.44 LB is HiGHS's documented dual vertex, now accepted.)
          EXCLUDE='_sddp_validate$'
          REGEX='${{ github.event.inputs.ctest_regex }}'
          ctest --output-on-failure -j"$(nproc)" --timeout 1800 \
            -E "$EXCLUDE" ${REGEX:+-R "$REGEX"} 2>&1 | tee ctest_output.log

      # Any file in tsan-logs/ is an unsuppressed report (TSan writes one
      # file per reporting process); the reporting test already failed
      # with exit code 66, this step just surfaces the stacks.
      - name: TSan report summary
        if: always()
        run: |
          shopt -s nullglob
          LOGS=(tsan-logs/tsan.*)
          N=0
          if [ ${#LOGS[@]} -gt 0 ]; then
            N=$(cat "${LOGS[@]}" | grep -c 'WARNING: ThreadSanitizer' || true)
          fi
          {
            echo '## ThreadSanitizer'
            echo ''
            echo "Unsuppressed reports: ${N} (in ${#LOGS[@]} process logs)"
            if [ "${N}" -gt 0 ]; then
              echo ''
              echo '```'
              cat "${LOGS[@]}" | grep -A14 'WARNING: ThreadSanitizer' | head -300
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${N}" -gt 0 ]; then
            echo "::error::${N} unsuppressed ThreadSanitizer report(s)"
            exit 1
          fi

      - name: upload TSan logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tsan-logs
          path: |
            tsan-logs/
            build/ctest_output.log
          retention-days: 14
