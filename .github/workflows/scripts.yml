name: Scripts
# uv package cache added to all jobs (actions/cache@v5 via setup-python-uv → ~/.cache/uv)

on:
  push:
    branches:
      - master
      - main
    paths:
      - "scripts/**"
      - "scripts/pyproject.toml"
      - ".github/workflows/scripts.yml"
      - ".github/actions/affected-tests/**"
      - "tools/affected_tests.py"
      - "tools/test_affected_tests.py"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "scripts/**"
      - "scripts/pyproject.toml"
      - ".github/workflows/scripts.yml"
      - ".github/actions/affected-tests/**"
      - "tools/affected_tests.py"
      - "tools/test_affected_tests.py"
  workflow_dispatch:
    inputs:
      full_run:
        description: 'Run the full suite (off = only tests affected vs origin/master)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read  # needed to download the gtopt-binary-debug CI artifact

# CI solves with the pinned HiGHS only (see ubuntu.yml / install-highs).
env:
  GTOPT_SOLVER: highs

jobs:
  # Known-vulnerability scan of the locked Python dependencies (scripts +
  # guiservice).  Light: no install, a single query per lock file.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python with uv
        uses: ./.github/actions/setup-python-uv

      - name: pip-audit (locked dependencies)
        run: |
          for lock in scripts/requirements-lock.txt guiservice/requirements-lock.txt; do
            echo "::group::pip-audit $lock"
            uvx pip-audit==2.10.1 --disable-pip --require-hashes --progress-spinner off -r "$lock"
            echo "::endgroup::"
          done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: unit-tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Incremental testing (tools/affected_tests.py): the own test dirs of
      # the changed packages run in full with coverage; reverse dependencies
      # run through pytest-testmon (coverage-based selection) when a
      # .testmondata database is restored from the cache, else in full.
      # Full run on workflow_dispatch (default) or without a usable base.
      - name: affected tests
        id: affected
        uses: ./.github/actions/affected-tests
        with:
          full: ${{ github.event_name == 'workflow_dispatch' && inputs.full_run }}
          title: Affected Python tests

      - name: Set up Python with uv
        uses: ./.github/actions/setup-python-uv

      # Hash-pinned install from the lock (tools/update_python_locks.sh):
      # reproducible and tamper-evident; the package itself goes in
      # without resolving dependencies again.
      - name: Install scripts package and dev dependencies
        run: |
          uv pip install --system --require-hashes -r scripts/requirements-lock.txt
          uv pip install --system --no-deps -e ./scripts
          uv pip install --system pytest-testmon

      - name: Selector self-test (tools/affected_tests.py)
        run: python -m pytest -q -n 0 -p no:cacheprovider tools/test_affected_tests.py

      # testmon database: any older DB is safe (testmon re-selects every
      # test whose recorded dependencies changed since), so fall back to
      # the most recent one when this exact commit has none.
      - name: Restore testmon database
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: scripts/.testmondata
          key: testmon-scripts-${{ runner.os }}-py3.12-${{ github.sha }}
          restore-keys: |
            testmon-scripts-${{ runner.os }}-py3.12-

      - name: Install Graphviz executables
        # dot/neato for the gtopt_diagram rendering tests, which skip
        # without them (the `graphviz` pip package is only the binding).
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends graphviz

      - name: Run unit tests with coverage
        # Full mode mirrors the `scripts-all-unit` ctest target — single
        # pytest invocation with pytest-xdist (`-n auto`), one fork per CPU,
        # so collection startup is paid once.  pytest-cov merges per-
        # worker coverage data automatically.  The coverage runs disable
        # pytest-testmon (-p no:testmon): testmon refuses to run next to
        # pytest-cov with branch coverage on ([tool.coverage.run]
        # branch = true), which crashed every xdist worker with an
        # INTERNALERROR.  Only the dependents run uses --testmon; tests
        # missing from its database are always selected, so a database
        # that never saw the coverage runs only over-selects.
        working-directory: scripts
        env:
          MODE: ${{ steps.affected.outputs.mode }}
          PY: ${{ steps.affected.outputs.py }}
          PY_DEPS: ${{ steps.affected.outputs.py_deps }}
          PYTEST_DIRECT: ${{ steps.affected.outputs.pytest }}
          PYTEST_DEPS: ${{ steps.affected.outputs.pytest_deps }}
        run: |
          set -o pipefail
          COMMON=(--ignore=plp2gtopt/tests/test_integration.py -n auto
                  -q --tb=short -m "not integration and not wheel")
          if [ "$MODE" = "full" ] || [ "$PY" = "full" ]; then
            pytest "${COMMON[@]}" -p no:testmon \
              --cov \
              --cov-report=json:coverage.json \
              --cov-report=xml:coverage.xml \
              --cov-report=term-missing
            exit 0
          fi
          rc=0
          if [ "$PY" = "subset" ]; then
            echo "::group::direct: $PYTEST_DIRECT"
            # A subset cannot reach the repo-wide fail_under (95 % of
            # every package): the per-package gate step judges it.
            # shellcheck disable=SC2086  # word-split the target list
            pytest "${COMMON[@]}" -p no:testmon --cov --cov-branch \
              --cov-fail-under=0 \
              --cov-report=json:coverage.json \
              --cov-report=xml:coverage.xml \
              --cov-report=term-missing $PYTEST_DIRECT || rc=1
            echo "::endgroup::"
          fi
          if [ "$PY_DEPS" != "none" ]; then
            TARGETS=""
            [ "$PY_DEPS" = "subset" ] && TARGETS="$PYTEST_DEPS"
            SELECT=()
            if [ -f .testmondata ]; then
              SELECT=(--testmon-forceselect)
              echo "dependents: testmon selection (database restored)"
            else
              echo "dependents: no testmon database -- running them in full"
            fi
            echo "::group::dependents (${PY_DEPS}): ${TARGETS:-all}"
            # Exit 5 = testmon selected nothing (no dependent affected).
            drc=0
            # shellcheck disable=SC2086
            pytest "${COMMON[@]}" --testmon "${SELECT[@]}" $TARGETS || drc=$?
            if [ "$drc" -ne 0 ] && [ "$drc" -ne 5 ]; then rc=1; fi
            echo "::endgroup::"
          fi
          exit $rc

      - name: Save testmon database
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: scripts/.testmondata
          key: testmon-scripts-${{ runner.os }}-py3.12-${{ github.sha }}

      - name: Wheel package-data check
        # Builds the gtopt_scripts wheel, installs it (non-editable) into a
        # throwaway venv and asserts every runtime data file ships and
        # loads (PLEXOS-HARD UC list, emissions/cogen tables, solver .prm,
        # gtopt_expand templates).  Guards against the 2026-11 bug where
        # wheel installs silently lacked them.
        working-directory: scripts
        run: |
          uv pip install --system setuptools wheel
          pytest -n 0 -q --tb=short -m wheel -p no:testmon \
            gtopt_shared/tests/test_wheel_package_data.py

      - name: ruff (lint)
        working-directory: scripts
        run: ruff check .

      - name: pylint
        working-directory: scripts
        env:
          MODE: ${{ steps.affected.outputs.mode }}
          PY: ${{ steps.affected.outputs.py }}
          PYLINT: ${{ steps.affected.outputs.pylint }}
        run: |
          if [ "$MODE" = "full" ] || [ "$PY" = "full" ]; then
            pylint --jobs=0 gtopt_compare cvs2parquet gtopt_diagram gtopt_field_extractor igtopt plp2gtopt pp2gtopt gtopt_monitor ts2gtopt gtopt2pp gtopt_check_json gtopt_check_lp gtopt_check_output gtopt_check_solvers gtopt_compress_lp gtopt_config run_gtopt sddp2gtopt gtopt2plp gtopt2sddp gtopt2plexos plexos2gtopt gasnet2gtopt dlr2gtopt gtopt_compare_runs
          elif [ -n "$PYLINT" ]; then
            # shellcheck disable=SC2086
            pylint --jobs=0 $PYLINT
          else
            echo "no changed package in the pylint gate"
          fi

      - name: mypy
        working-directory: scripts
        # Every package under scripts/ (tests/ excluded via [tool.mypy]);
        # affected mode: the changed packages plus their library importers.
        env:
          MODE: ${{ steps.affected.outputs.mode }}
          PY: ${{ steps.affected.outputs.py }}
          MYPY: ${{ steps.affected.outputs.mypy }}
        run: |
          if [ "$MODE" = "full" ] || [ "$PY" = "full" ]; then
            mypy cen2gtopt cen_demanda cucdata2gtopt cvs2parquet dlr2gtopt gtopt2pbi gtopt2pp gtopt_canonical_feed gtopt_check_cases gtopt_check_fingerprint gtopt_check_json gtopt_check_lp gtopt_check_output gtopt_check_pampl gtopt_check_solvers gtopt_check_topology gtopt_compare gtopt_compress_lp gtopt_config gtopt_diagram gtopt_expand gtopt_field_extractor gasnet2gtopt gtopt_marginal_units gtopt_monitor gtopt_operators gtopt_pricing_uplift gtopt_reduce_network gtopt_results_summary gtopt_shared gtopt_timeseries_export igtopt nrel118_to_gtopt plexos2gtopt plexos_compress_case plp2gtopt plp_compress_case pp2gtopt psse2gtopt rts_gmlc_to_gtopt run_gtopt sddp2gtopt gtopt2plp gtopt2sddp gtopt2plexos sienna2gtopt ts2gtopt gtopt_compare_runs --ignore-missing-imports
          elif [ -n "$MYPY" ]; then
            # shellcheck disable=SC2086
            mypy $MYPY --ignore-missing-imports
          else
            echo "no changed package to type-check"
          fi

      - name: ty (advisory, non-blocking)
        # Fast second type checker (astral-sh/ty, beta).  Configured in
        # [tool.ty] of scripts/pyproject.toml and run over the whole
        # scripts tree (~1 s).  Pinned (ty==<pin> in the dev extra of
        # scripts/pyproject.toml): ty 0.0.x still renames rules between
        # releases.  --exit-zero + continue-on-error keep it
        # advisory -- mypy above stays the blocking gate; findings show
        # up as GitHub annotations on the PR diff.
        if: always()
        working-directory: scripts
        continue-on-error: true
        run: ty check --python "$(which python)" --output-format github --exit-zero

      - name: Coverage gate (per package + total, branch)
        # Branch coverage of EVERY package listed in [tool.coverage.run]
        # source.  Fails when any package is below package_min or the
        # total is below total_min ([tool.gtopt.coverage] in
        # scripts/pyproject.toml).  Gaps are closed with tests, never
        # with `pragma: no cover`.
        # Full runs only; affected runs use the per-package gate below.
        if: always() && (steps.affected.outputs.mode == 'full' || steps.affected.outputs.py == 'full')
        working-directory: scripts
        run: |
          pytest -n 0 -q -p no:cacheprovider \
            ../tools/test_check_coverage_per_package.py
          python ../tools/check_coverage_per_package.py coverage.json \
            --config pyproject.toml

      - name: Per-package coverage gate (affected packages)
        # Affected runs measure only the packages whose own test dir ran
        # (coverage_packages): enforce the per-package thresholds for those,
        # never the total.  Active once tools/check_coverage_per_package.py
        # (per-package branch-coverage gate) is on master; full runs keep
        # their own gate.
        if: >-
          always() && steps.affected.outputs.mode == 'affected'
          && steps.affected.outputs.py == 'subset'
          && steps.affected.outputs.coverage_packages != ''
          && hashFiles('tools/check_coverage_per_package.py') != ''
        working-directory: scripts
        env:
          PKGS: ${{ steps.affected.outputs.coverage_packages }}
        run: |
          python ../tools/affected_tests.py --filter-coverage coverage.json \
            coverage-affected.json --coverage-packages "$PKGS"
          python ../tools/check_coverage_per_package.py coverage-affected.json \
            --config pyproject.toml --total-min 0

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-coverage-xml
          path: scripts/coverage.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Generate coverage summary
        if: always()
        working-directory: scripts
        run: |
          python - <<'EOF'
          import os
          import xml.etree.ElementTree as ET
          if not os.path.exists("coverage.xml"):
              raise SystemExit(0)
          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          line_rate = float(root.get("line-rate", 0)) * 100
          branch_rate = float(root.get("branch-rate", 0)) * 100
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(summary_file, "a") as f:
              f.write("## Python Scripts Coverage\n\n")
              f.write("| Metric | Coverage |\n|--------|----------|\n")
              f.write(f"| Lines  | {line_rate:.1f}% |\n")
              f.write(f"| Branches | {branch_rate:.1f}% |\n")
          EOF

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: integration-tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: affected tests
        id: affected
        uses: ./.github/actions/affected-tests
        with:
          full: ${{ github.event_name == 'workflow_dispatch' && inputs.full_run }}
          title: Affected Python integration tests

      # The integration suites below belong to plp2gtopt, igtopt and
      # ts2gtopt (plus the public-CLI smoke tests); in affected mode run
      # only those whose tests were selected.
      - name: integration targets
        id: targets
        env:
          MODE: ${{ steps.affected.outputs.mode }}
          PY: ${{ steps.affected.outputs.py }}
          PY_DEPS: ${{ steps.affected.outputs.py_deps }}
          SELECTED: ${{ steps.affected.outputs.pytest }} ${{ steps.affected.outputs.pytest_deps }}
        run: |
          all="plp2gtopt/tests/test_integration.py igtopt/tests ts2gtopt/tests tests/test_public_cli.py"
          if [ "$MODE" = "full" ] || [ "$PY" = "full" ] || [ "$PY_DEPS" = "full" ]; then
            targets="$all"
          else
            targets=""
            for pkg in plp2gtopt igtopt ts2gtopt; do
              case " $SELECTED " in
                *" ${pkg}/tests"*)
                  if [ "$pkg" = plp2gtopt ]; then
                    targets="$targets plp2gtopt/tests/test_integration.py"
                  else
                    targets="$targets ${pkg}/tests"
                  fi ;;
              esac
            done
          fi
          # The public-CLI smoke tests cover every package's entry point.
          if [ -n "$targets" ] || [ -n "${SELECTED// /}" ]; then
            case " $targets " in
              *" tests/test_public_cli.py "*) ;;
              *) targets="$targets tests/test_public_cli.py" ;;
            esac
          fi
          echo "targets=${targets# }" >> "$GITHUB_OUTPUT"
          echo "integration targets: ${targets:-none}"

      - name: Set up Python with uv
        if: steps.targets.outputs.targets != ''
        uses: ./.github/actions/setup-python-uv

      - name: Install scripts package and dev dependencies
        if: steps.targets.outputs.targets != ''
        run: uv pip install --system -e "./scripts[dev]" graphviz

      - name: Install solver runtime dependencies
        if: steps.targets.outputs.targets != ''
        run: |
          # The ubuntu.yml artifact ships the HiGHS plugin with the pinned
          # libhighs.so.1 (resolved via $ORIGIN); CI solves with HiGHS
          # only (GTOPT_SOLVER=highs), so no COIN-OR runtime is installed
          # and the OSI (CLP/CBC) plugin, if shipped, is skipped at load.
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends liblapack3 libblas3

      - name: Download gtopt binary and install runtime libraries
        if: steps.targets.outputs.targets != ''
        run: |
          # Download the binary from the latest CI artifact and install any
          # missing runtime libraries (skipped automatically if already present,
          # e.g. when the ubuntu.yml build job runs first on this runner).
          # Log messages go to stderr; the binary path is printed to stdout.
          GTOPT_BIN=$(python tools/get_gtopt_binary.py 2>/tmp/gtopt_dl.log)
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "ERROR: failed to obtain gtopt binary – full output:" >&2
            cat /tmp/gtopt_dl.log >&2
            exit $RC
          fi
          echo "GTOPT_BIN=$GTOPT_BIN" >> "$GITHUB_ENV"

          # Log binary version and available solver plugins for diagnostics
          echo "--- gtopt binary version ---"
          "$GTOPT_BIN" --version || true
          echo "--- Files alongside binary ---"
          ls -la "$(dirname "$GTOPT_BIN")/"
          echo "--- Available LP solver plugins ---"
          "$GTOPT_BIN" --lp-solvers || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify solver plugins are available
        id: check_solvers
        if: steps.targets.outputs.targets != ''
        run: |
          if "$GTOPT_BIN" --lp-solvers 2>&1 | grep -q "Available"; then
            echo "has_solvers=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=No solver plugins::The downloaded gtopt artifact does not contain solver plugins. Integration tests will be skipped. This resolves once the ubuntu.yml artifact is rebuilt with plugins."
            echo "has_solvers=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration tests
        if: steps.check_solvers.outputs.has_solvers == 'true'
        working-directory: scripts
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
          GTOPT_BIN: ${{ env.GTOPT_BIN }}
        run: |
          ulimit -c unlimited
          # shellcheck disable=SC2086
          pytest $TARGETS -v -m integration --tb=short

  cmake-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: cmake-install
    # Run after `test` so the uv package cache is warm and we fail fast on
    # unit-test/lint regressions before exercising cmake --install paths.
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python with uv
        uses: ./.github/actions/setup-python-uv

      # Pre-install runtime deps before cmake configure so that cmake's
      # find_program(PYTHON_EXECUTABLE) picks the same Python whose packages
      # are already cached, and the cmake --install pip step is faster.
      - name: Pre-install scripts runtime dependencies
        run: uv pip install --system -e "./scripts"

      - name: Configure scripts with CMake
        run: cmake -S scripts -B build-scripts

      - name: Install scripts via cmake --install
        run: cmake --install build-scripts

      - name: Verify installed entry-point scripts are on PATH
        run: |
          plp2gtopt --version
          echo "✓ plp2gtopt found on PATH after cmake --install"
          pp2gtopt --version
          echo "✓ pp2gtopt found on PATH after cmake --install"
          gtopt_diagram --help > /dev/null
          echo "✓ gtopt_diagram found on PATH after cmake --install"
          ts2gtopt --help > /dev/null
          echo "✓ ts2gtopt found on PATH after cmake --install"

      - name: plp_min_1bus – convert and validate JSON
        run: |
          mkdir -p /tmp/out_min_1bus
          plp2gtopt \
            -i scripts/cases/plp_min_1bus \
            -o /tmp/out_min_1bus \
            -f /tmp/out_min_1bus/gtopt_case.json
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("/tmp/out_min_1bus/gtopt_case.json"))
          assert d["system"]["bus_array"][0]["name"] == "Bus1", \
              f"Wrong bus name: {d['system']['bus_array'][0]['name']}"
          assert len(d["system"]["generator_array"]) == 1
          assert d["system"]["generator_array"][0]["name"] == "Thermal1"
          assert len(d["simulation"]["block_array"]) == 1
          print("✓ plp_min_1bus JSON validated")
          EOF

      - name: plp_min_2bus – convert and validate JSON
        run: |
          mkdir -p /tmp/out_min_2bus
          plp2gtopt \
            -i scripts/cases/plp_min_2bus \
            -o /tmp/out_min_2bus \
            -f /tmp/out_min_2bus/gtopt_case.json
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/out_min_2bus/gtopt_case.json"))
          assert len(d["system"]["bus_array"]) == 2
          assert len(d["system"]["generator_array"]) == 2
          assert len(d["system"]["line_array"]) == 1
          assert len(d["simulation"]["stage_array"]) == 2
          print("✓ plp_min_2bus JSON validated")
          EOF

      - name: plp_min_bess – convert and validate battery JSON
        run: |
          mkdir -p /tmp/out_min_bess
          plp2gtopt \
            -i scripts/cases/plp_min_bess \
            -o /tmp/out_min_bess \
            -f /tmp/out_min_bess/gtopt_case.json
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/out_min_bess/gtopt_case.json"))
          assert len(d["system"].get("battery_array", [])) == 1, \
              "Expected 1 battery"
          bat = d["system"]["battery_array"][0]
          assert bat["name"] == "BESS1"
          # Unified battery definition: bus field set, no separate converter
          assert "bus" in bat, "Expected unified battery with 'bus' field"
          assert "converter_array" not in d["system"], \
              "Unified battery should not produce converter_array"
          print("✓ plp_min_bess JSON validated")
          EOF

      - name: plp_min_hydro – convert with 2 hydrologies and validate JSON
        run: |
          mkdir -p /tmp/out_min_hydro
          plp2gtopt \
            -i scripts/cases/plp_min_hydro \
            -o /tmp/out_min_hydro \
            -f /tmp/out_min_hydro/gtopt_case.json \
            -y 1,2
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/out_min_hydro/gtopt_case.json"))
          scenarios = d["simulation"]["scenario_array"]
          assert len(scenarios) == 2, f"Expected 2 scenarios, got {len(scenarios)}"
          assert abs(scenarios[0]["probability_factor"] - 0.5) < 1e-9
          assert abs(scenarios[1]["probability_factor"] - 0.5) < 1e-9
          assert d["system"]["generator_array"][0]["name"] == "HydroGen"
          print("✓ plp_min_hydro JSON validated")
          EOF

      - name: pp2gtopt – convert ieee30b and validate JSON
        run: |
          pp2gtopt -o /tmp/ieee30b.json
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/ieee30b.json"))
          assert d["system"]["name"] == "ieee30b"
          assert len(d["system"]["bus_array"]) == 30
          assert len(d["system"]["generator_array"]) == 6
          assert d["options"]["model_options"]["use_kirchhoff"] is True
          print("✓ pp2gtopt ieee30b JSON validated")
          EOF

      - name: pp2gtopt – convert from pandapower JSON file
        run: |
          python3 - <<'EOF'
          import pandapower as pp
          import pandapower.networks as pn
          net = pn.case9()
          pp.to_json(net, "/tmp/case9_pp.json")
          print("Saved case9 pandapower JSON to /tmp/case9_pp.json")
          EOF
          pp2gtopt -f /tmp/case9_pp.json -o /tmp/case9_gtopt.json
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/case9_gtopt.json"))
          assert d["system"]["name"] == "case9_pp"
          assert len(d["system"]["bus_array"]) == 9
          print("✓ pp2gtopt file-based conversion (JSON) validated")
          EOF

      - name: pp2gtopt – list-networks
        run: |
          pp2gtopt --list-networks
          echo "✓ pp2gtopt --list-networks works"
