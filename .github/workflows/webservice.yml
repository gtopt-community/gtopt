name: Webservice

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Binary-dependent webservice tests (webservice, test-installed-integrations)
# run as jobs in the Ubuntu workflow (needs: build) so they can reliably access
# the gtopt binary artifact uploaded in the same run.
# This file is kept for pure Node.js unit/type checks that do not need gtopt.

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: webservice/package-lock.json

      - name: cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/webservice/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('webservice/package-lock.json') }}-${{ hashFiles('webservice/src/**/*.ts', 'webservice/src/**/*.tsx', 'webservice/*.mjs', 'webservice/*.js', 'webservice/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('webservice/package-lock.json') }}-

      - name: install dependencies
        working-directory: webservice
        run: npm ci

      - name: typecheck
        working-directory: webservice
        run: npm run typecheck

      - name: lint
        working-directory: webservice
        run: npm run lint

      - name: build
        working-directory: webservice
        run: npm run build

      - name: unit tests with coverage
        working-directory: webservice
        run: npm run test:unit

      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webservice-coverage-report
          path: webservice/coverage/
          retention-days: 30
          if-no-files-found: warn

      - name: generate coverage summary
        if: always()
        working-directory: webservice
        run: |
          echo "## TypeScript Webservice Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm run test:unit -- --coverageReporters=text 2>&1 | \
            grep -A 999 "^----------" | head -20 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
