name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "documentation/**"
      - "include/**"
      - "*.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

permissions:
  contents: read

jobs:
  check-latex-math:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # MathJax 3 (what GitHub renders math with), pinned by the lock file.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: tools/latex_lint/package-lock.json

      - name: Install lint dependencies
        run: |
          # pytest-xdist: tools/conftest.py implements one of its hooks
          pip install markdown-it-py mdit-py-plugins pytest pytest-xdist
          npm ci --prefix tools/latex_lint --no-audit --no-fund

      - name: Test the lint
        run: >-
          python -m pytest -q -p no:cacheprovider
          tools/test_check_latex_math.py tools/test_doxygen_md_math.py

      - name: Lint LaTeX math in Markdown
        run: |
          set +e
          OUTPUT=$(python tools/check_latex_math.py --strict-deps -- docs/ *.md 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "## ✅ LaTeX math lint: no issues" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Per-issue annotations: "<file>:<line>: [check] message"
          echo "$OUTPUT" | grep -E '^[^:]+\.md:[0-9]+:' | while IFS= read -r line; do
            FILE=${line%%:*}
            REST=${line#*:}
            echo "::error file=${FILE},line=${REST%%:*}::${REST#*: }"
          done
          N=$(echo "$OUTPUT" | grep -cE '\.md:[0-9]+:' || true)
          {
            echo "## ❌ LaTeX math lint: $N issue(s)"
            echo
            echo '```'
            echo "$OUTPUT"
            echo '```'
            echo
            echo "Fix locally: \`python tools/check_latex_math.py docs/ *.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  build-doxygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('cmake/CPM.cmake', 'cmake/tools.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            ${{ github.workflow }}-cpm-modules-

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen
          # markdown-it-py + mdit-py-plugins: the *.md math filter
          # (tools/doxygen_md_math.py); MathJax runs in the browser.
          pip3 install jinja2 Pygments markdown-it-py mdit-py-plugins

      - name: Build Doxygen documentation
        run: |
          cmake -S documentation -B build
          cmake --build build --target GenerateDocs

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: doxygen-html
          path: build/doxygen/html/
          if-no-files-found: warn

  deploy-pages:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: build-doxygen
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Doxygen HTML artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: doxygen-html
          path: site

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        continue-on-error: true

      - name: Warn on deployment failure
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages deployment failed. Ensure GitHub Pages is enabled in repo settings (Settings → Pages → Source: GitHub Actions)."
          echo "## ⚠️ Pages deployment skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The documentation was built successfully but could not be deployed to GitHub Pages." >> $GITHUB_STEP_SUMMARY
          echo "To enable deployment, go to **Settings → Pages** and set Source to **GitHub Actions**." >> $GITHUB_STEP_SUMMARY

  build-white-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache tectonic binary
        id: cache-tectonic
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/bin/tectonic
          key: tectonic-${{ runner.os }}

      # Tectonic downloads LaTeX packages from CTAN on first build of a given
      # document; cache them across runs so the white-paper build reuses the
      # package tree after the first successful run.
      - name: Cache tectonic LaTeX package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-packages-${{ hashFiles('docs/white_paper/main.tex') }}
          restore-keys: |
            tectonic-packages-

      - name: Install tectonic
        if: steps.cache-tectonic.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://drop-sh.fullyjustified.net \
            | sh -s -- --prefix "$HOME/.local"
          # Installer may drop binary in cwd on some versions
          if [ -f tectonic ]; then
            mv tectonic "$HOME/.local/bin/tectonic"
          fi
          chmod +x "$HOME/.local/bin/tectonic"

      - name: Add tectonic to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build white paper PDF
        run: |
          cd docs/white_paper
          tectonic main.tex

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: white-paper-pdf
          path: docs/white_paper/main.pdf
          if-no-files-found: warn
