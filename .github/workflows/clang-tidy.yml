name: clang-tidy

# Static analysis with clang-tidy 22 over a configure-only, non-unity
# compile DB (tools/run_tidy.sh --configure: one entry per file, test
# files included, no PCH).  Nothing is compiled.
#
#   pull_request / push : only the *.cpp files changed since the merge
#                         base (plus <stem>.cpp / test_<stem>.cpp of a
#                         changed <stem>.hpp) — a few minutes.
#   workflow_dispatch   : changed-only (vs the default branch) by
#                         default; `full: true` analyses every TU.
#
# There is NO scheduled run on GitHub: the full run of every TU WITH the
# static analyzer (clang-analyzer-*, path-sensitive, the most expensive
# group) is part of the maintainers' local nightly run.  Changed-file
# runs pass --no-analyzer, so an analyzer finding introduced by a PR
# surfaces in that nightly instead of on the PR itself.
#
# COIN-OR headers are installed only when the run analyses the OSI
# plugin (full runs, or a change under plugins/osi/); otherwise the OSI
# plugin is simply left
# out of the tidy DB.  The apt / LLVM mirror steps retry (Acquire::Retries
# and retry loops in the install-* actions).
#
# Result cache: ctcache (local mode) under $CTCACHE_DIR, persisted with
# actions/cache.  A TU whose preprocessed source + comments, effective
# .clang-tidy and flags are unchanged since a clean run is skipped.
# Caches written on the default branch (push runs) are visible to every
# PR.

on:
  pull_request:
    branches: [master, main]
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.h'
      - '**/.clang-tidy'
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'cmake_local/**'
      - 'tools/run_tidy.sh'
      - 'tools/install_ctcache.sh'
      - '.github/workflows/clang-tidy.yml'
      - '.github/actions/install-clang/**'
  push:
    branches: [master, main]
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.h'
      - '**/.clang-tidy'
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'cmake_local/**'
      - 'tools/run_tidy.sh'
      - 'tools/install_ctcache.sh'
      - '.github/workflows/clang-tidy.yml'
      - '.github/actions/install-clang/**'
  workflow_dispatch:
    inputs:
      full:
        description: 'Analyse every TU, with the analyzer (default: only files changed vs the default branch)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  CTCACHE_DIR: ${{ github.workspace }}/.ctcache
  # Fail instead of silently running uncached if ctcache is missing.
  GTOPT_TIDY_REQUIRE_CACHE: '1'
  TIDY_VERSION: '22'

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    # Changed-file runs take minutes; a cold full run (manual only, ~600
    # TUs on 4 vCPUs) is the worst case.
    timeout-minutes: 240
    name: clang-tidy

    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base with the target branch is needed for the
          # changed-files selection.
          fetch-depth: 0

      - name: select mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
        run: |
          full=false
          if [ "$EVENT" = workflow_dispatch ] && [ "$FULL_INPUT" = true ]; then
            full=true
          fi
          if [ "$full" = true ]; then
            echo "args=--all" >> "$GITHUB_OUTPUT"
            echo "coinor=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Changed-file runs: no clang-analyzer-* (local nightly only).
          echo "GTOPT_TIDY_ANALYZER=0" >> "$GITHUB_ENV"
          if [ "$EVENT" = pull_request ]; then
            base="origin/${BASE_REF}"
          elif [ "$EVENT" = workflow_dispatch ]; then
            base="origin/${DEFAULT_BRANCH}"
          else
            # Push: the previous tip; a new branch / force push has no
            # usable "before", so fall back to the last commit.
            base="$BEFORE"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base=HEAD~1
            fi
          fi
          echo "args=--base $base" >> "$GITHUB_OUTPUT"
          # COIN-OR headers only when the OSI plugin is among the files
          # tools/run_tidy.sh --base will select (same merge-base diff).
          coinor=false
          if git diff --name-only --diff-filter=d \
               "$(git merge-base "$base" HEAD)" \
             | grep -qE '^plugins/osi/'; then
            coinor=true
          fi
          echo "coinor=$coinor" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('cmake/CPM.cmake', 'cmake/tools.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            ${{ github.workflow }}-cpm-modules-
            Ubuntu-gcc-cpm-modules-

      # COIN-OR headers only, and only when plugins/osi/*.cpp is analysed
      # (see "select mode").  Nothing is solved here (CI tests run with
      # HiGHS only, see ubuntu.yml).
      - name: install dependencies
        uses: ./.github/actions/install-apt-deps
        with:
          coinor: ${{ steps.mode.outputs.coinor }}

      # Only this job moves to clang 22; the build/test jobs keep their
      # own compiler.  clang-22 provides the compiler the DB is
      # configured with (and its resource headers); clang-tidy-22 ships
      # run-clang-tidy-22.
      - name: install clang + clang-tidy ${{ env.TIDY_VERSION }}
        uses: ./.github/actions/install-clang
        with:
          version: ${{ env.TIDY_VERSION }}
          packages: clang clang-tidy

      # Pinned git checkout (ctcache is not on PyPI); the pin lives in
      # tools/install_ctcache.sh.  Installs to ~/.local/opt/ctcache,
      # where tools/run_tidy.sh finds it.
      - name: install ctcache
        run: bash tools/install_ctcache.sh

      # Key: clang-tidy version + every .clang-tidy (a config change
      # invalidates entries anyway; ctcache hashes the effective config)
      # + run id, so each run saves a fresh snapshot.  Restore falls back
      # to the newest snapshot for the same config, then to any snapshot
      # of the same clang-tidy version (still valid for unchanged TUs).
      - name: restore ctcache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CTCACHE_DIR }}
          key: ctcache-${{ env.TIDY_VERSION }}-${{ hashFiles('**/.clang-tidy') }}-${{ github.run_id }}
          restore-keys: |
            ctcache-${{ env.TIDY_VERSION }}-${{ hashFiles('**/.clang-tidy') }}-
            ctcache-${{ env.TIDY_VERSION }}-

      - name: configure tidy compile DB
        run: |
          CXX=clang++-$TIDY_VERSION CC=clang-$TIDY_VERSION \
            tools/run_tidy.sh --configure build-tidy

      - name: clang-tidy ${{ steps.mode.outputs.args }}
        run: |
          CLANG_TIDY=$(command -v "clang-tidy-$TIDY_VERSION") \
          RUN_CLANG_TIDY=$(command -v "run-clang-tidy-$TIDY_VERSION") \
            tools/run_tidy.sh -p build-tidy -j "$(nproc)" \
            ${{ steps.mode.outputs.args }}

      # Save even when tidy failed: clean TUs of a failing run are still
      # valid cache entries (only clean results are ever stored).
      - name: save ctcache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CTCACHE_DIR }}
          key: ctcache-${{ env.TIDY_VERSION }}-${{ hashFiles('**/.clang-tidy') }}-${{ github.run_id }}
