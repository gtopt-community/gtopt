name: Guiservice

on:
  push:
    branches:
      - master
      - main
    paths:
      - "guiservice/**"
      - ".github/workflows/guiservice.yml"
      # guiservice imports scripts packages (gtopt_diagram, ...): the
      # `select` job decides whether a scripts/ change reaches it.
      - "scripts/**"
      - ".github/actions/affected-tests/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "guiservice/**"
      - ".github/workflows/guiservice.yml"
      - ".pylintrc"
      - "scripts/**"
      - ".github/actions/affected-tests/**"
  workflow_dispatch:
    inputs:
      full_run:
        description: 'Run the full suite (off = only tests affected vs origin/master)'
        type: boolean
        default: true


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The GUI tests mock gtopt; pinned anyway so any real solve on CI uses
# HiGHS only, like every other workflow (see ubuntu.yml).
env:
  GTOPT_SOLVER: highs

jobs:
  # Incremental testing (tools/affected_tests.py): skip the guiservice jobs
  # when the change cannot reach guiservice (e.g. a scripts/ package it
  # does not import), run only the changed test files when nothing else
  # changed, and the full suite otherwise.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.affected.outputs.mode }}
      gui: ${{ steps.affected.outputs.gui }}
      gui_tests: ${{ steps.affected.outputs.gui_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: affected tests
        id: affected
        uses: ./.github/actions/affected-tests
        with:
          full: ${{ github.event_name == 'workflow_dispatch' && inputs.full_run }}
          title: Affected guiservice tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: select
    if: needs.select.outputs.mode == 'full' || needs.select.outputs.gui != 'none'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python with uv
        uses: ./.github/actions/setup-python-uv
        with:
          cache-suffix: guiservice
          cache-dependency-path: guiservice/requirements.txt

      - name: Install dependencies
        run: |
          uv pip install --system pytest pytest-cov pytest-xdist \
            ruff pylint mypy types-requests
          uv pip install --system --require-hashes -r guiservice/requirements-lock.txt
          # Test-only: requirements.txt omits pyarrow on purpose (see the
          # launcher job), but the tests write parquet and the topology
          # endpoints run scripts/gtopt_diagram, which needs networkx.
          uv pip install --system pyarrow networkx

      - name: ruff (lint)
        run: ruff check guiservice/app.py guiservice/gtopt_gui.py guiservice/gtopt_guisrv.py

      - name: pylint
        run: pylint --jobs=0 --rcfile=.pylintrc guiservice/app.py guiservice/gtopt_gui.py guiservice/gtopt_guisrv.py

      - name: mypy
        run: |
          mypy guiservice/app.py guiservice/gtopt_gui.py guiservice/gtopt_guisrv.py \
            --ignore-missing-imports

      - name: ty (advisory, non-blocking)
        # Fast second type checker (astral-sh/ty, beta), configured in
        # [tool.ty] of guiservice/pyproject.toml.  Pinned; advisory only
        # (--exit-zero + continue-on-error) -- mypy above is the gate.
        if: always()
        working-directory: guiservice
        continue-on-error: true
        run: |
          uvx ty@0.0.107 check --python "$(which python)" \
            --output-format github --exit-zero \
            app.py gtopt_gui.py gtopt_guisrv.py

      - name: Run tests with coverage
        if: always()
        env:
          MODE: ${{ needs.select.outputs.mode }}
          GUI_TESTS: ${{ needs.select.outputs.gui_tests }}
        run: |
          set -o pipefail
          if [ "$MODE" = "affected" ] && [ -n "$GUI_TESTS" ] \
             && [ "$GUI_TESTS" != "guiservice/tests" ]; then
            # Only test files changed: run just those (no coverage gate).
            # shellcheck disable=SC2086
            python -m pytest $GUI_TESTS -n auto -q --tb=short \
              | tee "${{ runner.temp }}/pytest-guiservice.log"
            exit 0
          fi
          python -m pytest guiservice/tests \
            -n auto -q --tb=short --cov=guiservice \
            --cov-config=guiservice/pyproject.toml --cov-report=term-missing \
            --cov-report=json:coverage-guiservice.json \
            --cov-report=html:coverage-guiservice \
            --cov-report=xml:coverage-guiservice.xml \
            | tee "${{ runner.temp }}/pytest-guiservice.log"

      - name: Coverage gate (branch, per package + total)
        # Skipped when the affected run only executed changed test files
        # (no coverage data is produced then).
        if: >-
          always() && !(needs.select.outputs.mode == 'affected'
          && needs.select.outputs.gui_tests != ''
          && needs.select.outputs.gui_tests != 'guiservice/tests')
        run: |
          python tools/check_coverage_per_package.py coverage-guiservice.json \
            --config guiservice/pyproject.toml

      - name: upload Python coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-guiservice-coverage-report
          path: coverage-guiservice/
          retention-days: 30
          if-no-files-found: warn

      - name: generate coverage summary
        if: always()
        run: |
          echo "## Python Guiservice Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          tail -8 "${{ runner.temp }}/pytest-guiservice.log" >> $GITHUB_STEP_SUMMARY || true

  install-and-test-launchers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: select
    if: needs.select.outputs.mode == 'full' || needs.select.outputs.gui != 'none'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python with uv
        uses: ./.github/actions/setup-python-uv
        with:
          cache-suffix: guiservice
          cache-dependency-path: guiservice/requirements.txt

      - name: Configure guiservice with CMake
        run: |
          cmake -S guiservice -B build-guiservice

      - name: Install guiservice
        run: |
          cmake --install build-guiservice --prefix $HOME/gtopt-install

      - name: Verify Python dependencies were installed
        run: |
          python3 -c "import flask; print(f'✓ Flask {flask.__version__} installed')"
          python3 -c "import pandas; print(f'✓ pandas {pandas.__version__} installed')"

      - name: install guiservice runtime pyarrow
        run: |
          # guiservice/requirements.txt intentionally omits pyarrow so a full
          # gtopt-scripts install (source-built pyarrow) is not clobbered by the
          # PyPI wheel's bundled libarrow.  This job installs only the
          # guiservice, so pyarrow — required by the gtopt_gui / gtopt_guisrv
          # launcher dependency check — is absent.  Install the PyPI wheel ONLY
          # when pyarrow is not already importable, never overwriting a source
          # build.
          if python3 -c "import pyarrow" 2>/dev/null; then
            echo "✓ pyarrow already available; leaving it untouched"
          else
            uv pip install --system pyarrow
          fi

      - name: Verify both launchers are installed
        run: |
          test -f $HOME/gtopt-install/bin/gtopt_gui
          test -x $HOME/gtopt-install/bin/gtopt_gui
          echo "✓ gtopt_gui launcher found and is executable"
          test -f $HOME/gtopt-install/bin/gtopt_guisrv
          test -x $HOME/gtopt-install/bin/gtopt_guisrv
          echo "✓ gtopt_guisrv launcher found and is executable"

      - name: Test gtopt_gui help
        run: |
          cd $HOME/gtopt-install/bin
          ./gtopt_gui --help | grep -qi "Launch the gtopt GUI service"
          echo "✓ gtopt_gui help works"

      - name: Test gtopt_guisrv help
        run: |
          cd $HOME/gtopt-install/bin
          ./gtopt_guisrv --help | grep -q "gtopt_guisrv"
          echo "✓ gtopt_guisrv help works"

      - name: Verify all critical files are installed
        run: |
          INSTALL_DIR=$HOME/gtopt-install/share/gtopt/guiservice
          MISSING=0
          for f in \
            app.py \
            requirements.txt \
            gtopt-guiservice.service \
            static/css/style.css \
            static/js/app.js \
            templates/index.html \
          ; do
            if [ -f "$INSTALL_DIR/$f" ]; then
              echo "✓ $f installed"
            else
              echo "✗ $f MISSING"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Some critical guiservice files were not installed"
            exit 1
          fi
          echo "✓ All critical guiservice files verified"

      - name: Test gtopt_guisrv starts and serves API
        run: |
          cd $HOME/gtopt-install/bin
          # Start gtopt_guisrv in background
          timeout 30 ./gtopt_guisrv --port 5099 > /tmp/gtopt_guisrv.log 2>&1 &
          GUI_PID=$!

          # Wait for service to start
          echo "Waiting for service to start..."
          for i in {1..30}; do
            if curl -s http://localhost:5099/api/schemas > /dev/null; then
              echo "✓ Service is up!"
              break
            fi
            sleep 1
          done

          # Test API endpoint
          echo "Testing API endpoint..."
          curl -s http://localhost:5099/api/schemas | python3 -c "import sys, json; data = json.load(sys.stdin); assert len(data) > 0, 'No schemas returned'; print(f'✓ API working: {len(data)} element types available')"

          # Test main page
          echo "Testing web UI..."
          curl -s http://localhost:5099/ | grep -qi "gtopt Case Editor" && echo "✓ Web UI working" || (echo "✗ Web UI test failed" && exit 1)

          # Cleanup
          kill $GUI_PID 2>/dev/null || true

          # Show logs if there were issues
          echo "=== Service logs ==="
          cat /tmp/gtopt_guisrv.log || true
