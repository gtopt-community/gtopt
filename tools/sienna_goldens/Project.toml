name = "SiennaGoldens"
description = "Julia env spec for the Sienna PowerSimulations.jl oracle that produces the goldens in this directory."

[deps]
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
HiGHS = "87dc4568-4c63-4d18-b0c0-bb2238e4078b"
HydroPowerSimulations = "fc1677e0-6ad7-4515-bf3a-bd6bf20a0b1b"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
OrderedCollections = "bac558e1-5e72-5ebc-8fee-abe8a469f55d"
PowerSimulations = "e690365d-45e2-57bb-ac84-44ba829e73c4"
PowerSystemCaseBuilder = "f00506e0-b84f-492a-93c2-c0a9afc4364e"
PowerSystems = "bcd98974-b02a-5e2f-9ee0-a103f5c450dd"
StorageSystemsSimulations = "e2f1a126-19d0-4674-9252-42b2384f8e3c"

# OrderedCollections 2.x breaks PowerSimulations 0.38 (DecisionModel build
# fails: "Cannot convert unordered AbstractDicts into OrderedDicts").
# Pardiso (pulled in via PowerNetworkMatrices) does not precompile on
# Julia 1.13; use Julia 1.11 (juliaup add 1.11; julia +1.11 ...).
[compat]
OrderedCollections = "1"
julia = "1.10, 1.11"

# How to recreate this env (mirrors the bootstrapping in
# tools/sienna_solve_golden.jl's banner):
#
#   mkdir -p ~/.julia_envs/sienna_golden && cd ~/.julia_envs/sienna_golden
#   julia +1.11 --project=. -e 'using Pkg; Pkg.add(["PowerSystems", \
#     "PowerSimulations", "PowerSystemCaseBuilder", \
#     "HydroPowerSimulations", "StorageSystemsSimulations", \
#     "DataFrames", "JSON", "HiGHS"]);
#     Pkg.add(name="OrderedCollections", version="1")'
#
# Then to (re)build all goldens:
#
#   julia +1.11 --project=. ${REPO}/tools/sienna_solve_golden.jl all
