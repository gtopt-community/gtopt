<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Template for the GTOpt social preview and org banner.
       Filled by tools/figures/make_brand.py ({{...}} placeholders).
       Keep all content at least 40 px from the edges. -->
  <title>{{TITLE}}</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfcfb"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Background: the IEEE 9-bus network (buses 1-9, its nine branches). -->
  <g opacity="0.16" stroke="#2a78d6" stroke-width="5" stroke-linecap="round">
    <line x1="840" y1="120" x2="980" y2="200"/>   <!-- 1-4 -->
    <line x1="980" y1="200" x2="900" y2="330"/>   <!-- 4-5 -->
    <line x1="980" y1="200" x2="1110" y2="320"/>  <!-- 4-6 -->
    <line x1="900" y1="330" x2="930" y2="470"/>   <!-- 5-7 -->
    <line x1="1110" y1="320" x2="1110" y2="470"/> <!-- 6-9 -->
    <line x1="930" y1="470" x2="1020" y2="540"/>  <!-- 7-8 -->
    <line x1="1020" y1="540" x2="1110" y2="470"/> <!-- 8-9 -->
    <line x1="800" y1="540" x2="930" y2="470"/>   <!-- 2-7 -->
    <line x1="1220" y1="560" x2="1110" y2="470"/> <!-- 3-9 -->
  </g>
  <g opacity="0.2" fill="#2a78d6">
    <circle cx="980" cy="200" r="13"/><circle cx="900" cy="330" r="13"/>
    <circle cx="1110" cy="320" r="13"/><circle cx="930" cy="470" r="13"/>
    <circle cx="1020" cy="540" r="13"/><circle cx="1110" cy="470" r="13"/>
  </g>
  <g opacity="0.28" fill="#eb6834">
    <circle cx="840" cy="120" r="16"/><circle cx="800" cy="540" r="16"/>
    <circle cx="1220" cy="560" r="16"/>
  </g>

  {{MARK}}
  {{WORDMARK}}

  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
    <text x="64" y="408" font-size="38" font-weight="bold" fill="#0b0b0b">{{TAGLINE}}</text>
    <text x="64" y="458" font-size="30" fill="#52514e">{{SUBTITLE}}</text>
    <text x="64" y="584" font-size="22" fill="#52514e">{{FOOTER}}</text>
  </g>
</svg>
